name: Build iOS Location Reminders

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'capacitor.config.json'
      - 'package*.json'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build the interface and sync native dependencies
        run: |
          npm ci
          npm test
          npm run build
          npx --no-install cap sync ios
      - name: Compile the iPhone device target
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/device" CODE_SIGNING_ALLOWED=NO build
      - name: Build and launch on an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json, sys; print(next(d["udid"] for runtime, devices in json.load(sys.stdin)["devices"].items() if ".iOS-" in runtime for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Debug -destination "id=$udid" \
            -derivedDataPath "$RUNNER_TEMP/simulator" ONLY_ACTIVE_ARCH=NO ARCHS="arm64 x86_64" build
          app="$RUNNER_TEMP/simulator/Build/Products/Debug-iphonesimulator/App.app"
          lipo -verify_arch arm64 x86_64 "$app/App"
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" com.spadecorp.locationreminders
          mkdir -p artifacts
          ditto -c -k --keepParent "$app" artifacts/SPaDe-Location-Reminders-iOS-Simulator.zip
      - name: Verify and collect the device build's icon reference
        run: |
          app="$RUNNER_TEMP/device/Build/Products/Release-iphoneos/App.app"
          name=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$app/Info.plist")
          test "$name" = AppIcon
          test -s "$app/Assets.car"
          icons="ios/App/App/Assets.xcassets/$name.appiconset"
          filename=$(python3 -c 'import json,sys; print(next(i["filename"] for i in json.load(open(sys.argv[1]))["images"] if i["size"] == "1024x1024"))' "$icons/Contents.json")
          cp "$icons/$filename" artifacts/SPaDe-Location-Reminders-iOS-Icon-1024.png
      - uses: actions/upload-artifact@v4
        with:
          name: SPaDe-Location-Reminders-iOS
          path: artifacts/
          if-no-files-found: error
